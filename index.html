<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <style>
        body {
            margin: 0;
            background-color: #18181b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        canvas {
            background-color: #27272a;
            border: 3px solid #3f3f46;
            border-radius: 8px;
        }
        #hint {
            margin-top: 15px;
            font-size: 14px;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <div id="score-board">Счет: 0</div>
    <canvas id="game" width="320" height="320"></canvas>
    <div id="hint">Проводите пальцем по экрану, чтобы поворачивать</div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score-board");

        const box = 16;
        let score = 0;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };
        let d = "RIGHT";

        document.addEventListener("keydown", direction);
        function direction(event) {
            if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if (event.keyCode == 38 && d != "DOWN") d = "UP";
            else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if (event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20 && d != "LEFT") d = "RIGHT";
                else if (dx < -20 && d != "RIGHT") d = "LEFT";
            } else {
                if (dy > 20 && d != "UP") d = "DOWN";
                else if (dy < -20 && d != "DOWN") d = "UP";
            }
        }, false);

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function draw() {
            ctx.fillStyle = "#27272a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#22c55e" : "#4ade80";
                ctx.fillRect(snake[i].x, snake[i].y, box - 1, box - 1);
            }

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(food.x, food.y, box - 1, box - 1);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerText = "Счет: " + score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                score = 0;
                scoreEl.innerText = "Счет: 0";
                snake = [{ x: 10 * box, y: 10 * box }];
                d = "RIGHT";
                return;
            }

            snake.unshift(newHead);
        }

        setInterval(draw, 130);
    </script>
</body>
</html>
